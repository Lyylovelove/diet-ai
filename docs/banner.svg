<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10"/>
      <stop offset="50%" stop-color="#0D1522"/>
      <stop offset="100%" stop-color="#091E1C"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151F30" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0E1522" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="24" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow1)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
  </g>

  <!-- App Icon Badge -->
  <g transform="translate(76, 78)">
    <rect x="0" y="0" width="76" height="76" rx="22" fill="#111C2D" stroke="#34D399" stroke-opacity="0.4" stroke-width="1.5"/>
    <path d="M38 15C24.2 15 13 26.2 13 40C13 55.2 34.1 66.8 36.6 68.1C37.5 68.5 38.5 68.5 39.4 68.1C41.9 66.8 63 55.2 63 40C63 26.2 51.8 15 38 15Z" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 41L35.5 46.5L47 35" fill="none" stroke="#34D399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Tagline -->
  <text x="172" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">DietAI</text>
  <rect x="318" y="92" width="58" height="26" rx="13" fill="#10B981" fill-opacity="0.18" stroke="#34D399" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="347" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#34D399" text-anchor="middle" letter-spacing="1">PRO</text>

  <text x="172" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#94A3B8">AI-Powered Multimodal Nutrition &amp; Calorie Tracker for Android</text>

  <!-- Description -->
  <text x="76" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#CBD5E1">
    融合多模态视觉识别、中国食物成分表 (第6版) 与 USDA 权威数据库、Atwater 能量守恒校验的智能饮食管家
  </text>

  <!-- Feature Pills -->
  <g transform="translate(76, 242)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="148" height="36" rx="18" fill="#131D2E" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="18" r="4" fill="#34D399"/>
    <text x="34" y="23" fill="#E2E8F0">图文多模态识别</text>

    <rect x="160" y="0" width="168" height="36" rx="18" fill="#131D2E" stroke="#334155" stroke-width="1"/>
    <circle cx="180" cy="18" r="4" fill="#38BDF8"/>
    <text x="194" y="23" fill="#E2E8F0">Atwater 能量守恒</text>

    <rect x="340" y="0" width="164" height="36" rx="18" fill="#131D2E" stroke="#334155" stroke-width="1"/>
    <circle cx="360" cy="18" r="4" fill="#FBBF24"/>
    <text x="374" y="23" fill="#E2E8F0">ISSN 临床营养推算</text>

    <rect x="516" y="0" width="156" height="36" rx="18" fill="#131D2E" stroke="#334155" stroke-width="1"/>
    <circle cx="536" cy="18" r="4" fill="#F43F5E"/>
    <text x="550" y="23" fill="#E2E8F0">深浅主题随系统</text>
  </g>

  <!-- Right Side Decorative Bento Cockpit Card -->
  <g transform="translate(830, 48)">
    <rect x="0" y="0" width="300" height="264" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.8" stroke-width="1.5"/>

    <!-- Ring Gauge -->
    <g transform="translate(150, 96)">
      <circle cx="0" cy="0" r="56" fill="none" stroke="#1E293B" stroke-width="10"/>
      <circle cx="0" cy="0" r="56" fill="none" stroke="url(#brandGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="260 360" transform="rotate(-90)"/>
      <text x="0" y="-16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">今日还可摄入</text>
      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#F8FAFC" text-anchor="middle">640</text>
      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">KCAL</text>
    </g>

    <!-- Left/Right Stats -->
    <text x="42" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">已摄入</text>
    <text x="42" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC" text-anchor="middle">1360</text>

    <text x="258" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">目标预算</text>
    <text x="258" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC" text-anchor="middle">2000</text>

    <!-- 3 Macro Mini Cards -->
    <g transform="translate(20, 176)" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
      <rect x="0" y="0" width="80" height="66" rx="12" fill="#0B111D" stroke="#1E293B"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#FB7185">蛋白质</text>
      <text x="10" y="40" font-size="13" font-weight="800" fill="#F8FAFC">128/150g</text>
      <rect x="10" y="50" width="60" height="5" rx="2.5" fill="#1E293B"/>
      <rect x="10" y="50" width="51" height="5" rx="2.5" fill="#FB7185"/>

      <rect x="90" y="0" width="80" height="66" rx="12" fill="#0B111D" stroke="#1E293B"/>
      <text x="100" y="20" font-size="11" font-weight="700" fill="#FBBF24">碳水</text>
      <text x="100" y="40" font-size="13" font-weight="800" fill="#F8FAFC">142/200g</text>
      <rect x="100" y="50" width="60" height="5" rx="2.5" fill="#1E293B"/>
      <rect x="100" y="50" width="43" height="5" rx="2.5" fill="#FBBF24"/>

      <rect x="180" y="0" width="80" height="66" rx="12" fill="#0B111D" stroke="#1E293B"/>
      <text x="190" y="20" font-size="11" font-weight="700" fill="#38BDF8">脂肪</text>
      <text x="190" y="40" font-size="13" font-weight="800" fill="#F8FAFC">46/65g</text>
      <rect x="190" y="50" width="60" height="5" rx="2.5" fill="#1E293B"/>
      <rect x="190" y="50" width="42" height="5" rx="2.5" fill="#38BDF8"/>
    </g>
  </g>
</svg>
