plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dietai.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.dietai.app"
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName "17.1"
    }

    signingConfigs {
        fixedKey {
            storeFile file("dietai-release.jks")
            storePassword "dietai123456"
            keyAlias "dietai"
            keyPassword "dietai123456"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.fixedKey
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.fixedKey
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
