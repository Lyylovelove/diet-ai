name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Rename APK for release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/DietAI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DietAI-Android-App
          path: release-output/DietAI.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: DietAI Android v1.0.1
          body: |
            ### 🥗 DietAI 饮食卡路里助手安装包
            
            - **文件名**：`DietAI.apk`
            - **功能**：DeepSeek 拍照识菜、中餐热量估算、宏量营养素统计、日/周/月统计分析、离线数据记录
            - **使用方式**：下载后发到安卓手机上直接安装即可！
          files: release-output/DietAI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
