name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Fixed Signing Keystore
        run: |
          if [ ! -f app/dietai-release.jks ]; then
            keytool -genkeypair -v \
              -keystore app/dietai-release.jks \
              -alias dietai \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass dietai123456 \
              -keypass dietai123456 \
              -dname "CN=DietAI, OU=Mobile, O=DietAI, L=Beijing, S=Beijing, C=CN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/dietai-release.jks
            git commit -m "chore: persist fixed signing keystore for seamless APK upgrades [skip ci]" || true
            git push || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Rename APK for release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/DietAI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DietAI-Android-App
          path: release-output/DietAI.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.17
          name: DietAI Android v17.0 PRO
          body: |
            ### 🥗 DietAI PRO v17.0 智能饮食管家
            
            - **文件名**：`DietAI.apk`
            - **更新亮点**：修复桌面图标显示（LAUNCHER category）、设置页改为独立底部导航页面（去除弹窗与主页设置按钮）、深浅色主题跟随系统
          files: release-output/DietAI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
